  list_type: group
  default: "40"
  resolve_group_membership: true

onboarding_profile_url:
  type: string
  default: "/profile-setup"

onboarding_dismissal_version:
  type: string
  default: "3"

# -----------------------------------------------------------------------------
# Profile setup page
# -----------------------------------------------------------------------------

profile_setup_replaces_preferences:
  type: bool
  default: true

# -----------------------------------------------------------------------------
# Non-member homepage banner
# -----------------------------------------------------------------------------

nonmember_member_groups:
