en:
  theme_metadata:
    description: SPC homepage using native categories, filters, and a three-column topic-card feed.
    settings:
      monthly_category_slug: Slug of the Discourse category used for monthly challenges.
      monthly_category_id: Numeric ID of the monthly challenge category.
      challenge_timezone: Timezone used for challenge dates and deadlines.
      guide_topic_url: Link to the complete entry and voting guide.
      challenges:
        description: One row per official challenge topic. Keep exactly one row active; archive it after recording the winner.
        schema:
          properties:
            topic_id:
              label: Official challenge topic ID
              description: Numeric ID of the official Discourse topic. Its localized title, first paragraph, full post, and first image supply the challenge content.
            tag:
              label: Challenge tag
              description: Internal tag used to filter and automatically tag submissions, for example 2026-07-cityscapes.
            status:
              label: Status
            start_at:
              label: Start date
              description: ISO date with timezone, for example 2026-07-01T00:00:00+02:00.
            submission_deadline:
              label: Submission deadline
            voting_deadline:
              label: Voting deadline
            gallery_url:
              label: Entry gallery URL
              description: Optional stable URL for this month’s entry gallery. Archived cards fall back to the official topic.
            cover_image:
              label: Challenge cover image override
              description: Optional. When empty, the first non-emoji image in the official topic is used.
            winner_title:
              label: Winning photo title
            winner_author:
              label: Winner name
            winner_topic_url:
              label: Winning entry URL
            winner_image:
              label: Winning image
            entry_count:
              label: Final entry count
      webinars_url: Destination for the Monthly Live Webinars card.
      homepage_banner_image: Member-homepage banner image. A landscape image around 2:1 works best.
      homepage_about_url_de: Destination of the community information link for the German interface.
      homepage_about_url_en: Destination of the community information link for the English interface.
      homepage_about_url_fr: Destination of the community information link for the French interface.
      onboarding_member_groups: Groups whose members see the onboarding panel. This defaults to the SPC ‘members’ group.
      onboarding_profile_url: Destination for the Profile step.
      onboarding_show_on_mobile: Show the onboarding panel on mobile devices.
      onboarding_dismissal_version: Change this value to reset progress and dismissal for every member.
      nonmember_member_groups: Groups whose members should not see the banner. This defaults to the SPC ‘members’ group.
      nonmember_join_url_de: Membership-button destination for the German interface.
      nonmember_join_url_en: Membership-button destination for the English interface.
      nonmember_join_url_fr: Membership-button destination for the French interface.
      nonmember_categories_url: Destination for the browse-categories button.
      nonmember_show_categories_button: Show the browse-categories button.
