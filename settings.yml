# =============================================================================
# SPC Suite settings
#
# Grouped by feature. The prefix on each setting name tells you which feature
# owns it; settings without a feature prefix belong to the original Suite
# stack (homepage + monthly challenge + /submit), which is why they kept
# their historical names.
#
# NOTE: setting VALUES live in the Discourse database, not in this file.
# Renaming a setting here resets it to the default below on the next update,
# so every default is the value that was live in production at merge time.
# =============================================================================

# -----------------------------------------------------------------------------
# Feature toggles
#
# The three original Suite features (homepage design, monthly challenge, and
# the /submit page) have no toggle: they are one interlinked stack - route map,
# `submit` permalink and the route:new-topic override - and a half-enabled
# state would break /submit. Branding has no toggle either, because it is pure
# CSS with no JS entry point to gate.
# -----------------------------------------------------------------------------

enable_critique_workspace:
  type: bool
  default: true
  description: "Critique Workspace: side-by-side critique modal on first posts in the critique categories."

enable_leaderboard:
  type: bool
  default: true
  description: "Leaderboard Strip: compact gamification leaderboard above the topic list."

enable_onboarding:
  type: bool
  default: true
  description: "Member Onboarding: three-step progress panel on the homepage for signed-in members."

enable_nonmember_banner:
  type: bool
  default: true
  description: "Non-Member Banner: join call-to-action on the homepage for visitors who are not members."

enable_category_hero:
  type: bool
  default: true
  description: "Category Hero: shared hero header on every category page. Turning it off restores the native category header and background. Native list controls remain available in either state. The Monthly Challenge hero remains enabled because it is part of the photo-submission workflow."

enable_locale_cookie:
  type: bool
  default: true
  description: "Locale Cookie: mirrors the forum interface language into a cookie on swissphotoclub.com so the main site can match it."

enable_local_featured_categories:
  type: bool
  default: false
  description: "Homepage: migration switch — render homepage categories locally. Default navigation menu categories are the highlighted cards. Enable only when the external Featured Categories component is detached."

# -----------------------------------------------------------------------------
# Monthly challenge, homepage and /submit page (original Suite stack)
# -----------------------------------------------------------------------------

homepage_secondary_categories:
  type: list
  list_type: category
  default: "12|8|4|2"
  description: "Homepage: compact category cards shown after the highlighted Default navigation menu categories. A category selected in both settings appears once as a highlighted card."

homepage_banner_image:
  type: upload
  default: ""
  description: "Homepage: member-homepage banner image. A landscape image around 2:1 works best."

homepage_about_url_de:
  type: string
  default: "/t/willkommen-bei-swiss-photo-club-community/5"
  description: "Homepage: destination of the community information link for the German interface."

homepage_about_url_en:
  type: string
  default: "/t/willkommen-bei-swiss-photo-club-community/5"
  description: "Homepage: destination of the community information link for the English interface."

homepage_about_url_fr:
  type: string
  default: "/t/willkommen-bei-swiss-photo-club-community/5"
  description: "Homepage: destination of the community information link for the French interface."

challenge_category_id:
  type: integer
  default: 6
  description: "Monthly Challenge: ID of the challenge category (Admin > Categories, the number in the URL). Keep in sync with monthly_category_id."

challenge_category_slug:
  type: string
  default: monthly-challenge
  description: "Monthly Challenge: slug of the challenge category, used to catch New Topic links. Keep in sync with monthly_category_slug."

round_tag_mode:
  type: enum
  default: auto
  choices:
    - auto
    - fixed
  description: "Monthly Challenge: how the round tag is chosen. auto = find the category tag starting with the current month (e.g. 2026-07-cityscapes). fixed = always use the round_tag setting below."

round_tag:
  type: string
  default: ""
  description: "Monthly Challenge: round tag applied to submissions when round_tag_mode is 'fixed' (e.g. 2026-07)"

show_banner:
  type: bool
  default: false
  description: "Monthly Challenge: show an extra 'Submit a photo' banner at the top of the challenge category topic list (off by default because the challenge hero already has a submit button)"

replace_new_topic_button:
  type: bool
  default: true
  description: "Monthly Challenge: in the challenge category, the New Topic button opens the photo submission page instead of the composer"

challenge_max_entries_per_round:
  type: integer
  default: 1
  min: 0
  description: "Monthly Challenge: how many photos one member may enter per round. When reached, the submission form shows a friendly notice and disables its submit button. 0 turns the check off. This is an in-form nudge, not server-side enforcement."

monthly_category_slug:
  type: string
  default: monthly-challenge

monthly_category_id:
  type: integer
  default: 6

challenge_timezone:
  type: string
  default: Europe/Zurich

guide_topic_url:
  type: string
  default: /t/monatliche-foto-challenge-so-funktioniert-es/8

challenges:
  type: objects
  default:
    - topic_id: 37
      tag: 2026-07-cityscapes
      status: active
      start_at: "2026-07-01T00:00:00+02:00"
      submission_deadline: "2026-07-31T23:59:00+02:00"
      voting_deadline: "2026-08-03T23:59:00+02:00"
      gallery_url: ""
      winner_title: ""
      winner_author: ""
      winner_topic_url: ""
      entry_count: 0
  schema:
    name: challenge
    identifier: tag
    properties:
      topic_id:
        type: integer
        required: true
      tag:
        type: string
        required: true
      status:
        type: enum
        required: true
        choices:
          - draft
          - active
          - archived
      start_at:
        type: string
        required: true
      submission_deadline:
        type: string
        required: true
      voting_deadline:
        type: string
      gallery_url:
        type: string
      cover_image:
        type: upload
      winner_title:
        type: string
      winner_author:
        type: string
      winner_topic_url:
        type: string
      winner_image:
        type: upload
      entry_count:
        type: integer

webinars_url:
  type: string
  default: "/upcoming-events"

# -----------------------------------------------------------------------------
# Critique Workspace
# -----------------------------------------------------------------------------

workspace_enabled_categories:
  type: list
  list_type: category
  default: "7"
  description: "Critique Workspace: categories where the critique workspace banner is offered on the first post."

# -----------------------------------------------------------------------------
# Critique Submit buttons
# -----------------------------------------------------------------------------

critique_category_slug:
  type: string
  default: "photo-feedback"
  description: "Critique Submit: slug of the critique category."

critique_category_id:
  type: integer
  default: 7
  description: "Critique Submit: ID of the critique category. Used by /submit/critique to post the request and to ask Discourse which subject tags that category accepts."

critique_intro_category_slug:
  type: string
  default: "introductions"
  description: "Critique Submit: slug of the member introductions category."

critique_intro_category_id:
  type: integer
  default: 12
  description: "Critique Submit: ID of the member introductions category. Used by /submit/introduction to post the introduction."

critique_banner_background:
  type: string
  default: "#FFE8E8"
  description: "Critique Submit: currently unread — kept so the old pink banner stays restorable without a commit. Delete rather than repurpose."

critique_banner_text_color:
  type: string
  default: "#1A2744"
  description: "Critique Submit: currently unread — kept with the banner background above. Delete rather than repurpose."

critique_intro_banner_background:
  type: string
  default: "#E8F0F0"
  description: "Critique Submit: currently unread — kept with the banner background above. Delete rather than repurpose."

# -----------------------------------------------------------------------------
# Leaderboard strip
# -----------------------------------------------------------------------------

leaderboard_id:
  type: integer
  default: 1
  min: 1
  description: "Leaderboard: the Gamification leaderboard to display."

leaderboard_leader_count:
  type: integer
  default: 3
  min: 1
  max: 5
  description: "Leaderboard: number of ranked members to show in the compact strip."

leaderboard_show_on_homepage:
  type: bool
  default: false
  description: "Leaderboard: show the strip on the community homepage."

