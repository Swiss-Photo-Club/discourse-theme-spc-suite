de:
  theme_metadata:
    description: SPC-Homepage mit nativen Kategorien, Filtern und einer dreispaltigen Themen-Kartenansicht.
    settings:
      enable_critique_workspace: "Kritik-Arbeitsplatz: Seite-an-Seite-Kritikfenster auf dem ersten Beitrag in den Kritik-Kategorien."
      enable_leaderboard: "Bestenliste: kompakte Gamification-Bestenliste über der Themenliste."
      enable_onboarding: "Onboarding: dreistufiges Fortschritts-Panel auf der Startseite für angemeldete Mitglieder."
      enable_nonmember_banner: "Nichtmitglieder-Banner: Beitritts-Aufruf auf der Startseite für Besucher, die keine Mitglieder sind."
      enable_category_hero: "Kategorie-Hero: gemeinsamer Hero-Header auf jeder Kategorieseite. Ausschalten stellt den nativen Kategorie-Header und -Hintergrund wieder her. Die nativen Listen-Bedienelemente bleiben in beiden Zuständen verfügbar. Der Hero der Monats-Challenge bleibt aktiv, weil er Teil des Foto-Einreichungs-Workflows ist."
      enable_locale_cookie: "Sprach-Cookie: spiegelt die Forumssprache in ein Cookie auf swissphotoclub.com, damit die Hauptseite sie übernehmen kann."
      enable_local_featured_categories: "Startseite: Migrationsschalter — Startseiten-Kategorien lokal rendern. Die Kategorien des Standard-Navigationsmenüs sind die hervorgehobenen Karten. Nur aktivieren, wenn die externe Featured-Categories-Komponente entfernt ist."
      homepage_secondary_categories: "Startseite: kompakte Kategorie-Karten nach den hervorgehobenen Kategorien des Standard-Navigationsmenüs. Eine in beiden Einstellungen gewählte Kategorie erscheint einmal als hervorgehobene Karte."
      challenge_category_id: "Monats-Challenge: ID der Challenge-Kategorie (Admin > Kategorien, die Nummer in der URL)."
      round_tag: "Monats-Challenge: fester Runden-Tag für Einreichungen (z. B. 2026-07-cityscapes). Leer lassen für den Automatikmodus: Der Kategorie-Tag, der mit dem aktuellen Monat beginnt, wird verwendet."
      show_banner: "Monats-Challenge: zusätzliches «Foto einreichen»-Banner oben in der Themenliste der Challenge-Kategorie anzeigen (standardmässig aus, weil der Challenge-Hero bereits einen Einreichen-Button hat)."
      replace_new_topic_button: "Monats-Challenge: In der Challenge-Kategorie öffnet der Button «Neues Thema» die Foto-Einreichungsseite statt des Editors."
      challenge_timezone: "Monats-Challenge: Zeitzone für Challenge-Daten und Fristen."
      guide_topic_url: "Monats-Challenge: Link zur vollständigen Anleitung für Teilnahme und Abstimmung."
      challenges:
        description: "Monats-Challenge: eine Zeile pro offiziellem Challenge-Thema. Genau eine Zeile aktiv halten; nach dem Eintragen des Gewinners archivieren."
        schema:
          properties:
            topic_id:
              label: ID des offiziellen Challenge-Themas
              description: Numerische ID des offiziellen Discourse-Themas. Sein lokalisierter Titel, erster Absatz, vollständiger Beitrag und das erste Bild liefern den Challenge-Inhalt.
            tag:
              label: Challenge-Tag
              description: Interner Tag zum Filtern und automatischen Taggen der Einreichungen, zum Beispiel 2026-07-cityscapes.
            status:
              label: Status
            start_at:
              label: Startdatum
              description: ISO-Datum mit Zeitzone, zum Beispiel 2026-07-01T00:00:00+02:00.
            submission_deadline:
              label: Einreichefrist
            voting_deadline:
              label: Abstimmungsfrist
            gallery_url:
              label: URL der Einreichungsgalerie
              description: Optionale stabile URL für die Galerie dieses Monats. Archivierte Karten fallen auf das offizielle Thema zurück.
            cover_image:
              label: Challenge-Titelbild (Override)
              description: Optional. Wenn leer, wird das erste Nicht-Emoji-Bild des offiziellen Themas verwendet.
            winner_title:
              label: Titel des Gewinnerfotos
            winner_author:
              label: Name der Gewinnerin oder des Gewinners
            winner_topic_url:
              label: URL des Gewinnerbeitrags
            winner_image:
              label: Gewinnerbild
            entry_count:
              label: Finale Anzahl Einreichungen
      workspace_enabled_categories: "Kritik-Arbeitsplatz: Kategorien, in denen das Arbeitsplatz-Banner auf dem ersten Beitrag angeboten wird."
      critique_category_id: "Kritik-Einreichung: ID der Kritik-Kategorie. Wird von /submit/critique verwendet, um die Anfrage zu posten und Discourse nach den akzeptierten Thema-Tags dieser Kategorie zu fragen."
      critique_intro_category_id: "Kritik-Einreichung: ID der Vorstellungs-Kategorie. Wird von /submit/introduction verwendet, um die Vorstellung zu posten."
      leaderboard_id: "Bestenliste: die anzuzeigende Gamification-Bestenliste."
      leaderboard_leader_count: "Bestenliste: Anzahl der platzierten Mitglieder in der kompakten Leiste."
      leaderboard_show_on_homepage: "Bestenliste: die Leiste auf der Community-Startseite anzeigen."
      webinars_category_id: "Live-Webinare: ID der Webinar-Kategorie (Admin > Kategorien, die Nummer in der URL). Die Startseiten-Karte «Monatliche Live-Webinare» verlinkt darauf, und die Kategorie erhält den Webinar-Hero. 0 fällt auf webinars_url zurück."
      webinars_url: "Startseite: Ersatzziel der Karte «Monatliche Live-Webinare», wenn webinars_category_id 0 ist oder keine Kategorie ergibt."
      homepage_banner_image: "Startseite: Bannerbild der Mitglieder-Startseite. Empfohlenes Bildformat ungefähr 2:1."
      homepage_about_url_de: "Startseite: Ziel des Community-Informationslinks für die deutsche Oberfläche."
      homepage_about_url_en: "Startseite: Ziel des Community-Informationslinks für die englische Oberfläche."
      homepage_about_url_fr: "Startseite: Ziel des Community-Informationslinks für die französische Oberfläche."
      challenge_max_entries_per_round: "Monats-Challenge: Wie viele Fotos ein Mitglied pro Runde einreichen kann. Ist das Limit erreicht, zeigt das Formular einen freundlichen Hinweis und deaktiviert den Absenden-Button. 0 schaltet die Prüfung ab. Nur ein Hinweis im Formular, keine serverseitige Durchsetzung."
      onboarding_member_groups: "Onboarding: Gruppen, deren Mitglieder das Onboarding sehen. Standardmässig sind dies die SPC-Gruppen ‚members‘ und ‚trial‘."
      onboarding_profile_url: "Onboarding: Ziel des Schritts ‚Profil‘."
      onboarding_dismissal_version: "Onboarding: Ändere diesen Wert, um Fortschritt und Ausblendung für alle Mitglieder zurückzusetzen."
      profile_setup_replaces_preferences: "Profil-Einrichtung: Die eigene Seite Einstellungen → Profil führt stattdessen zur freundlichen Seite /profile-setup. Der vollständige Editor bleibt über einen Link auf dieser Seite erreichbar."
      nonmember_member_groups: "Nichtmitglieder-Banner: Gruppen, deren Mitglieder das Banner nicht sehen. Standardmässig sind dies die SPC-Gruppen ‚members‘ und ‚trial‘ sowie Administratoren und Moderatoren."
      nonmember_join_url_de: "Nichtmitglieder-Banner: Ziel des Mitgliedschafts-Buttons für die deutsche Oberfläche."
      nonmember_join_url_en: "Nichtmitglieder-Banner: Ziel des Mitgliedschafts-Buttons für die englische Oberfläche."
      nonmember_join_url_fr: "Nichtmitglieder-Banner: Ziel des Mitgliedschafts-Buttons für die französische Oberfläche."
      nonmember_categories_url: "Nichtmitglieder-Banner: Ziel des Buttons zum Durchsuchen der Kategorien."
      nonmember_show_categories_button: "Nichtmitglieder-Banner: Den Button zum Durchsuchen der Kategorien anzeigen."
      nonmember_trial_mode: "Nichtmitglieder-Banner: Launch-Modus für die offene Testphase. Solange aktiv, sehen ausgeloggte Besucher die Einladung zur kostenlosen Testphase und einen Button ‚Anmelden und kostenlos testen‘, der zu /login führt (die Testphase startet automatisch bei der ersten Anmeldung); eingeloggte Nichtmitglieder behalten den Mitgliedschafts-Aufruf. Nur einschalten, solange spc-be die offene Testphase gewährt; ausgeschaltet gilt wieder der normale Beitritts-Text."
      nonmember_trial_days: "Nichtmitglieder-Banner: Dauer der Testphase in Tagen, die in der Einladung genannt wird. Muss zu trial_days in spc-be passen (Nova → Community Trial Settings). 0 lässt die Dauer im Text weg, z. B. solange sie sich je nach Land unterscheidet."
      members_only_url: "Nur-für-Mitglieder-Seite: Ziel für Nichtmitglieder, die ein /submit-Formular oder einen Beitrags-Button in einer Kategorie ohne Schreibrecht öffnen — dieselbe spc-be-Seite, auf die das Category-Lockdown-Plugin gesperrte Themen umleitet. Leer fällt auf Discourse’ /login zurück."
