# =============================================================================
# SPC Suite settings
#
# Grouped by feature. The prefix on each setting name tells you which feature
# owns it; settings without a feature prefix belong to the original Suite
# stack (homepage + monthly challenge + /submit), which is why they kept
# their historical names.
#
# NOTE: setting VALUES live in the Discourse database, not in this file.
# Renaming a setting here resets it to the default below on the next update,
# so every default is the value that was live in production at merge time.
# =============================================================================

# -----------------------------------------------------------------------------
# Feature toggles
#
# The three original Suite features (homepage design, monthly challenge, and
# the /submit page) have no toggle: they are one interlinked stack - route map,
# `submit` permalink and the route:new-topic override - and a half-enabled
# state would break /submit. Branding has no toggle either, because it is pure
# CSS with no JS entry point to gate.
# -----------------------------------------------------------------------------

enable_critique_workspace:
  type: bool
  default: true
  description: "Critique Workspace: side-by-side critique modal on first posts in the critique categories."

enable_critique_submit:
  type: bool
  default: true
  description: "Critique Submit: wizard buttons above the topic list in the critique and introductions categories."

enable_leaderboard:
  type: bool
  default: true
  description: "Leaderboard Strip: compact gamification leaderboard above the topic list."

enable_onboarding:
  type: bool
  default: true
  description: "Member Onboarding: three-step progress panel on the homepage for signed-in members."

enable_nonmember_banner:
  type: bool
  default: true
  description: "Non-Member Banner: join call-to-action on the homepage for visitors who are not members."

enable_locale_cookie:
  type: bool
  default: true
  description: "Locale Cookie: mirrors the forum interface language into a cookie on swissphotoclub.com so the main site can match it."

# -----------------------------------------------------------------------------
# Monthly challenge, homepage and /submit page (original Suite stack)
# -----------------------------------------------------------------------------

challenge_category_id:
  type: integer
  default: 6
  description: "ID of the Monthly Challenge category (Admin > Categories, the number in the URL)"

challenge_category_slug:
  type: string
  default: monthly-challenge
  description: "Slug of the Monthly Challenge category, used to catch New Topic links"

round_tag_mode:
  type: enum
  default: auto
  choices:
    - auto
    - fixed
  description: "How the challenge round tag is chosen. auto = find the category tag starting with the current month (e.g. 2026-07-cityscapes). fixed = always use the round_tag setting below."

round_tag:
  type: string
  default: ""
  description: "Round tag applied to submissions when round_tag_mode is 'fixed' (e.g. 2026-07)"

show_banner:
  type: bool
  default: false
  description: "Show an extra 'Submit a photo' banner at the top of the challenge category topic list (off by default because the challenge hero already has a submit button)"

replace_new_topic_button:
  type: bool
  default: true
  description: "In the challenge category, the New Topic button opens the photo submission page instead of the composer"

monthly_category_slug:
  type: string
  default: monthly-challenge

monthly_category_id:
  type: integer
  default: 6

challenge_timezone:
  type: string
  default: Europe/Zurich

guide_topic_url:
  type: string
  default: /t/monatliche-foto-challenge-so-funktioniert-es/8

show_education:
  type: bool
  default: true

show_archive:
  type: bool
  default: true

challenges:
  type: objects
  default:
    - topic_id: 37
      tag: 2026-07-cityscapes
      status: active
      start_at: "2026-07-01T00:00:00+02:00"
      submission_deadline: "2026-07-31T23:59:00+02:00"
      voting_deadline: "2026-08-03T23:59:00+02:00"
      gallery_url: ""
      winner_title: ""
      winner_author: ""
      winner_topic_url: ""
      entry_count: 0
  schema:
    name: challenge
    identifier: tag
    properties:
      topic_id:
        type: integer
        required: true
      tag:
        type: string
        required: true
      status:
        type: enum
        required: true
        choices:
          - draft
          - active
          - archived
      start_at:
        type: string
        required: true
      submission_deadline:
        type: string
        required: true
      voting_deadline:
        type: string
      gallery_url:
        type: string
      cover_image:
        type: upload
      winner_title:
        type: string
      winner_author:
        type: string
      winner_topic_url:
        type: string
      winner_image:
        type: upload
      entry_count:
        type: integer

webinars_url:
  type: string
  default: "/upcoming-events"

# -----------------------------------------------------------------------------
# Critique Workspace
# -----------------------------------------------------------------------------

workspace_enabled_categories:
  type: list
  list_type: category
  default: "7"
  description: "Categories where the critique workspace banner is offered on the first post."

# -----------------------------------------------------------------------------
# Critique Submit buttons
# -----------------------------------------------------------------------------

critique_category_slug:
  type: string
  default: "critique-portfolio-reviews"
  description: "Slug of the critique category."

critique_category_id:
  type: integer
  default: 7
  description: "ID of the critique category. Used by /submit?type=critique to post the request and to ask Discourse which subject tags that category accepts."

critique_image_use_form:
  type: bool
  default: true
  description: "Send 'Submit an image' to the built-in /submit?type=critique form. Turn this off to fall back to the Custom Wizard at critique_image_wizard_url - a rollback that takes effect immediately, without a theme update."

critique_image_wizard_url:
  type: string
  default: "/w/bild-zur-kritik-einreichen"
  description: "Wizard URL for submitting a single image for critique, used only when critique_image_use_form is off. The locale suffix (-en / -fr) is appended automatically."

critique_project_wizard_url:
  type: string
  default: "/w/projekt-zur-kritik-einreichen"
  description: "Wizard URL for submitting a project or series for critique. The locale suffix is appended automatically."

critique_intro_category_slug:
  type: string
  default: "vorstellungen"
  description: "Slug of the member introductions category."

critique_intro_wizard_url:
  type: string
  default: "/w/vorstellung-einreichen"
  description: "Wizard URL for the member introduction. The locale suffix is appended automatically."

critique_hide_new_topic_button:
  type: bool
  default: true
  description: "Hide the default New Topic button in the critique and introductions categories, so the wizard buttons are the only way in."

critique_banner_background:
  type: string
  default: "#FFE8E8"
  description: "Background colour of the critique category banner."

critique_banner_text_color:
  type: string
  default: "#1A2744"
  description: "Text colour of the critique and introductions category banners."

critique_intro_banner_background:
  type: string
  default: "#E8F0F0"
  description: "Background colour of the introductions category banner."

# -----------------------------------------------------------------------------
# Leaderboard strip
# -----------------------------------------------------------------------------

leaderboard_id:
  type: integer
  default: 1
  min: 1
  description: "The Gamification leaderboard to display."

leaderboard_leader_count:
  type: integer
  default: 3
  min: 1
  max: 5
  description: "Number of ranked members to show in the compact strip."

leaderboard_show_on_homepage:
  type: bool
  default: false
  description: "Show the strip on the community homepage."

leaderboard_enabled_categories:
  type: list
  list_type: category
  default: "7"
  description: "Categories where the strip should appear."

